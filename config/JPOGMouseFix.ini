[Cursor]
; Park cursor speed (1.0 = game default, without acceleration). Lower = slower.
; Try 0.3 - 0.7 depending on your mouse DPI.
Speed=0.5
; 1 = no acceleration (linear 1:1 movement). 0 = original game acceleration.
DisableAcceleration=1
; 1 = same horizontal and vertical speed on non-4:3 screens (e.g. 16:9).
FixAspect=1

[FirstPerson]
; Minimum of the "Mouse sensitivity" slider in Options > Controls
; (first-person camera: jeep, helicopter, photos). Original: 0.25
SliderMin=0.05

[Zoom]
; 1 = mouse wheel zoom does not depend on FPS.
FixWheel=1
; Zoom per wheel click. 1.0 = like the original game at 30 FPS.
WheelStrength=1.0

[Camera]
; Boton central: arrastrar. Shift + central: rotar/inclinar. Solo parque.
; 0 = controles anteriores. Reiniciar tras cambiar estas opciones.
ModernControls=1
; Controlador propio: zoom, angulos, altura y suavizado separados.
IndependentController=1
MinDistance=2
MaxDistance=250
; Zoom al seleccionar dinosaurio/edificio, independiente del tamano de la unidad.
FocusMinDistance=2
FocusMaxDistance=250
MinPitch=-85
; 0 = horizonte. La camara del parque no mira por encima del horizonte.
MaxPitch=0
FixedFOV=50
; Alt + central + movimiento vertical: altura independiente.
; Tiempo de respuesta (segundos): menor = mas directo; mayor = mas suave.
ResponseSeconds=0.12
DragPanSensitivity=0.0015
DragRotateSensitivity=0.0018
; Rueda mas precisa cerca del suelo, mas rapida lejos; conserva limites nativos.
ProportionalZoom=1
; 1 = park camera acceleration/braking (edges, keys, rotation, zoom) lasts the same at any FPS.
FixSmoothing=1
; Reference FPS for that smoothing. 30 = as smooth as the original. Higher = snappier.
ReferenceFPS=30
; Edge scrolling speed. Original: Vertical=2.0 (up/down), Horizontal=1.0 (sides).
EdgeScrollVertical=1.5
EdgeScrollHorizontal=1.5

[Display]
; 1 = forces a borderless window covering the monitor (Alt+Tab, screenshots). 0 = original fullscreen.
Borderless=1
; 1 = Alt+F4 quits the game.
AltF4Quit=1
; 1 = the game does not grab the keyboard: Print Screen, Alt+F4, Windows key work.
FreeKeyboard=1
; 1 = keep running and drawing while another window has the focus.
RunInBackground=0

[Widescreen]
; 1 = on wide screens show more on the sides (Hor+) instead of cropping top/bottom.
HorPlus=1
; UI on wide screens:
;   2 = 16:9 anchored: menus centered in 4:3, in-game HUD attached to the real screen edges
;   1 = everything centered in 4:3
;   0 = stretched like the original
HUDMode=2

[HUD]
; Mapa nativo con mayor detalle, abajo a la derecha, sin overlay adicional.
; 0 = restaurar mapa original al reiniciar el juego.
EnhancedMinimap=1
; Resolucion real y tamano en unidades GUI: 64 (original), 128, 256.
MinimapSize=128
MinimapMargin=16
; Reserva vertical para el boton de correo del juego.
MinimapBottom=56

[Mods]
; 1 = replace textures with images from mods\textures (see the readme there).
TextureReplacement=1

[Performance]
; 1 = faster equivalents of hot game code (terrain section sort, matrix multiply).
GameFastPaths=1

[Debug]
; 1 = log Direct3D 8 usage to d3d8_profile\ (for the dx11 branch).
ProfileD3D8=0
