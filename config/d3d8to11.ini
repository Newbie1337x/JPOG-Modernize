[Renderer]
; Master switch for custom scene effects; keeps individual presets.
EffectsEnabled=1
; d3d11    = custom Direct3D 8 -> Direct3D 11 renderer (this d3d8.dll)
; dgvoodoo = forward everything to D3D8_dgVoodoo.dll (the original dgVoodoo d3d8.dll, renamed)
Backend=d3d11
; 1 = wait for vertical sync
VSync=0
; Frame rate cap (0 = unlimited)
FPSLimit=165
; Anisotropic filtering forced on mipmapped textures (0 or 1 = game setting)
Anisotropy=16
; 1 = apply the game's brightness/contrast/gamma ramp
ApplyGammaRamp=1
; Antialiasing samples for the 3D scene and HUD: 0 (off), 2, 4 or 8
MSAA=8
; 1 = soft edges on alpha-tested foliage and fences when MSAA is on
AlphaToCoverage=0

[Debug]
; 1 = enable the D3D11 debug layer (requires Graphics Tools)
D3D11DebugLayer=0
; 1 = write every generated HLSL shader to d3d8to11_shaders\
DumpShaders=0

[Lighting]
; Experimental sun shadows cast by terrain, buildings, trees and dinosaurs on top of the
; game's own lighting. 0 = original look. Restart the game after changing this section.
Enabled=1
; Map size: 1024, 2048, 4096 or 8192. Bigger = sharper shadows, more GPU memory.
ShadowResolution=4096
; Farthest distance from the camera (game units) that still gets shadows.
ShadowDistance=250
; 0 = no darkening, 1 = black shadows.
ShadowStrength=0.25
; game  = follow the direction the game lights its dinosaurs with
; fixed = use SunX/SunY/SunZ (direction toward the sun, Y is up; JPOG's world is Y-down,
;         converted internally)
SunSource=game
SunX=-0.35
SunY=0.82
SunZ=-0.45
; Lowest sun height allowed (0.05-1). Low suns make very long shadows.
SunMinHeight=0.35
; 1 = grass blades cast shadows too (noisy).
GrassShadows=0
; 1 = hills shadow the ground (the game already shades slopes; can add noise).
TerrainShadows=0
; Debug: 0 off, 3 shadow mask, 4 normals, 5 mask + shadow map, 6 world grid, 7 raw visibility,
; 9 ambient occlusion only, 10 light shafts only,
; 8 dump one frame to d3d8to11_dump\ (see docs/SUN_LIGHTING.md).
DebugView=0
; Experimental per-pixel relighting of models and terrain, starting from the game's own light
; colours (docs/LIGHTING_REPLACEMENT.md). DebugView 1/2 apply to it.
ReplaceOriginal=0
; Scales of the game's own sun and ambient colours (1 = the original balance; a stronger sun and
; a slightly weaker ambient give the contrast of a clear day)
RelightSun=1.35
RelightAmbient=0.85
; Blue sky light on faces looking up, warm bounce on faces looking down (0..1)
RelightSkyTint=0.65
RelightExposure=0.95
; Soft shoulder for highlights above 0.8 instead of clipping
RelightTonemap=1
; Terrain and paths lit from the game's native height field (smooth normals for any sun direction)
; instead of the baked per-vertex sun factor
HeightfieldLighting=1
; Hills and mountains shade the terrain behind them (0..1)
HorizonShadows=1
; Sunlit silhouettes on dinosaurs and models, strongest against the light (0..2)
RimLight=0.5
; Keep the darkening the game painted into its baked terrain light (under trees, hollows), 0..1
BakedTerrainDetail=1
; Light of the material pilot when ReplaceOriginal=0
Ambient=0.60
SunIntensity=0.55

[Post]
; Sunlight and colour applied to the 3D world before the HUD (also in the Insert panel).
Enabled=1
; Warm extra light where the sun reaches, 0..1
SunBoost=0.25
; Blue tint in shadows, 0..1
ShadowCool=0.5
Exposure=1.0
Contrast=0.97
Saturation=1.09
; -1 cold .. 1 warm
Warmth=0.23

[Effects]
; Ambient occlusion (HBAO) and volumetric sun light shafts (also in the Insert panel).
AO=1
; Occlusion search radius in world units
AORadius=2.0
AOStrength=0.7
; Light shafts need sun shadows ([Lighting] Enabled=1)
LightShafts=1
ShaftStrength=0.35
; 0 = even haze .. 0.95 = tight glow toward the sun
ShaftScatter=0.6

[NormalMaps]
; Relief from <library>__<texture>_n.dds next to the textures in mods\textures
; (generate with: python tools\make_normals.py <game>\mods\textures). Also in the Insert panel.
Enabled=1
Strength=1.5
; 1 = OpenGL-style maps (green up)
FlipGreen=0

[Tessellation]
; PN-triangle smoothing: rounds the silhouette of low-poly models on the GPU (also in the Insert panel).
Enabled=1
; 1 = only models textured from dinos_* libraries
DinosOnly=1
; Subdivisions per edge (1-16); edges are split until a piece is about PixelsPerEdge long on screen
MaxFactor=8
PixelsPerEdge=10
; 0 = flat (no change) .. 1 = full curvature from the vertex normals
Curvature=1.0
; 1 if tessellated models look inside out
FlipWinding=0
; Real relief from the texture (bright raised), in world units; 0 = off
Displacement=0.03
; Texture mip the relief is read from: higher = softer, broader shapes
DetailMip=0
InvertRelief=0
; Fade the relief at the original triangle edges so texture seams cannot crack
SeamSafe=1
; Vertices split at the same position (UV seams, hard edges) share one curve so limbs and seams
; do not crack open
WeldSeams=1

[Relief]
; Parallax occlusion and self-shadowing on dinosaur skins (pixel shader, no extra geometry).
; Height comes from the skin texture's local brightness (bright = raised).
Enabled=1
; Height range in texture pixels
Depth=3
; View-dependent texture shift: 0 = self-shadowing only, 1 = full
Parallax=0.5
; How dark the shadows cast by scales and folds get, 0..1
SelfShadow=0.6
; Penumbra width in texture pixels
Softness=1
Invert=0

[Grass]
; Creatures bend and flatten the grass around them (also in the Insert panel).
Enabled=1
; Sideways bend, in blade heights
Push=0.8
; 0..1 of the blade pressed down
Flatten=0.5
; Multiplies the footprint taken from each creature's skeleton
RadiusScale=1.0
; Skinned models with fewer bones (props, trees) do not push grass
MinBones=6

[Overlay]
; In-game settings panel. Key = virtual-key code (45 = Insert, 121 = F10, 123 = F12).
Key=45
; 1 = small FPS counter while the panel is closed
ShowFPS=0
; Panel/text size
Scale=1.0

[Water]
; First stage: depth absorption, shallow transparency, Fresnel and shore foam.
; Reuses the game's wave simulation and reflection texture.
Enabled=1
DepthScale=6.0
Transparency=0.8
Reflection=0.85
Foam=0.35
FoamWidth=0.65
Distortion=2.0
Ripples=1.0
Speed=1.0
Interaction=1
InteractionStrength=1.0
; Screen-space scene reflections. Falls back to original reflection outside the screen.
SceneReflections=1
SceneReflectionStrength=1.0
SceneReflectionDistance=80
SceneReflectionSteps=24
; Native complete terrain, edge-connected water = ocean, enclosed = lagoon.
; 0 automatic, 1 force all lagoon, 2 force all ocean.
SurfaceMode=0
LagoonFoam=0.03
LagoonRipples=0.25
OceanRipples=1.4
; World-space vertex swell, oceans only. 0 amplitude disables displacement.
SwellAmplitude=0.65
SwellLength=1.0
SwellCoastDepth=3.0
CrestFoam=0.35
; 0 shaded, 1 water thickness, 2 Fresnel, 3 foam
DebugView=0

[Performance]
; One CSV row/second, unique file per session, rotation every 36000 rows.
LogCSV=1
; Async GPU timestamp sampling every 30 frames, independent of the open panel.
MeasureGPU=1

[Materials]
; Pilot only: Triceratops skins (dinos_hellcreek_b tex5/tex4) and the hamburger-shop ornament.
Enabled=1
SkinRoughness=0.58
BuildingRoughness=0.78
Specular=0.85
Environment=0.25
NormalStrength=0.65

[Antialiasing]
; Experimental DX11 x86 native temporal AA. Overrides TAA/FSR1 while active.
FSR31=1
; Experimental synchronous frame generation. Requires FSR31, VSync, native aspect/size.
FrameGeneration=0
; Experimental camera-reprojected TAA before HUD. No skinned motion vectors yet.
TAA=1
HistoryWeight=0.72
; Official AMD FSR1 shaders: EASU if input < output, RCAS at native resolution.
; Does not reduce the game's internal resolution or generate frames.
FSR1=1
Sharpness=0.5
