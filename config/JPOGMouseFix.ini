[Cursor]
; Velocidad del cursor del parque (1.0 = original del juego, sin aceleracion).
; Mas bajo = mas lento. Proba entre 0.3 y 0.7 segun el DPI de tu mouse.
Speed=0.5
; 1 = sin aceleracion (movimiento 1:1 lineal). 0 = aceleracion original del juego.
DisableAcceleration=1
; 1 = misma velocidad horizontal y vertical en pantallas no 4:3 (ej. 16:9).
FixAspect=1

[FirstPerson]
; Minimo del slider "Sensibilidad del mouse" en Opciones > Controles
; (camara en primera persona: jeep, helicoptero, fotos). Original: 0.25
SliderMin=0.05

[Zoom]
; 1 = el zoom con la ruedita no depende de los FPS.
FixWheel=1
; Cuanto zoom hace cada clic de la rueda. 1.0 = como el juego original a 30 FPS.
; Subilo (ej. 2.0) si queres que cada clic haga mas zoom.
WheelStrength=1.0

[Camera]
; 1 = la aceleracion/frenado de la camara del parque (bordes, teclas, rotacion, zoom)
; dura lo mismo a cualquier FPS, en vez de ser mas brusca cuantos mas FPS tengas.
FixSmoothing=1
; FPS de referencia para ese suavizado. 30 = suave como en el original.
; Mas alto = la camara arranca y frena mas rapido.
ReferenceFPS=30
; Velocidad al poner el mouse en los bordes de la pantalla.
; Original del juego: Vertical=2.0 (arriba/abajo) y Horizontal=1.0 (costados).
EdgeScrollVertical=1.5
EdgeScrollHorizontal=1.5

[Display]
; 1 = fuerza modo ventana sin bordes que ocupa todo el monitor (permite Alt+Tab y capturas).
; 0 = pantalla completa original del juego.
Borderless=1
; 1 = Alt+F4 cierra el juego.
AltF4Quit=1
; 1 = el juego no "secuestra" el teclado: funcionan Impr Pant, Alt+F4, tecla Windows, etc.
FreeKeyboard=1

[Widescreen]
; 1 = en 16:9 se ve mas a los costados (Hor+) en vez de recortar arriba y abajo.
HorPlus=1
; Interfaz en pantallas anchas:
;   2 = 16:9 anclado: menus centrados en 4:3, HUD de partida pegado a los bordes reales
;   1 = todo en 4:3 centrado
;   0 = estirado como el original
HUDMode=2

[Mods]
; 1 = reemplaza texturas con las imagenes de la carpeta mods\textures (ver LEEME.txt ahi).
TextureReplacement=1
